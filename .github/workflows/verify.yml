name: Verify reproducibility materials
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: sha256sum --check SHA256SUMS
      - run: python checks/check_circular_lifts.py
      - run: python checks/check_pairs_independent.py
      - run: git diff --exit-code -- checks/*.json
  lean-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          lake-package-directory: formalization
          auto-config: 'false'
          build: 'true'
          use-mathlib-cache: 'true'
      - name: Audit final theorem dependencies
        working-directory: formalization
        shell: bash
        run: |
          set -euo pipefail
          lake env lean Audit.lean | tee audit-current.txt
          test "$(grep -Fc 'depends on axioms: [propext, Classical.choice, Quot.sound]' audit-current.txt)" -eq 2
          ! grep -q 'sorryAx' audit-current.txt
